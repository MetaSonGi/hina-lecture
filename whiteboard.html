<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>와글보드 — 화이트보드</title>
<link rel="stylesheet" href="https://esm.sh/@tldraw/tldraw@3.13.0/tldraw.css" />
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Pretendard", sans-serif; }
  #root { position: fixed; inset: 0; }
  #status {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 1000;
    background: rgba(20, 24, 34, 0.92); color: #fff; font-size: 13px; padding: 8px 16px;
    border-radius: 20px; pointer-events: none;
  }
  #back {
    position: fixed; bottom: 14px; left: 14px; z-index: 1000;
    background: #2f81f7; color: #fff; border: none; border-radius: 10px;
    padding: 10px 18px; font-size: 14px; font-weight: 700; cursor: pointer;
  }
</style>
<script type="importmap">
{ "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
} }
</script>
</head>
<body>
<div id="status">연결 중…</div>
<div id="root"></div>
<button id="back">← 강의실로</button>
<script type="module" src="whiteboard.js"></script>
</body>
</html>
